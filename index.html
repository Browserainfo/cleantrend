<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Trendera Dry Cleaning</title>
    <meta name="description" content="Comprehensive CRM and operations management platform for Trendera Dry Cleaners, featuring secure authentication, role-based anti-fraud controls, and end-to-end garment workflow tracking." />
    <meta property="og:title" content="Trendera Dry Cleaning" />
    <meta property="og:description" content="Comprehensive CRM and operations management platform for Trendera Dry Cleaners, featuring secure authentication, role-based anti-fraud controls, and end-to-end garment workflow tracking." />
    <script>
      (function() {
        // Intercept WebSocket creation for Vite dev HMR to suppress connection errors in sandboxed preview iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          var CustomWebSocket = function(url, protocols) {
            try {
              var ws = protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
              ws.addEventListener('error', function(e) {
                if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
              }, true);
              return ws;
            } catch (err) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                readyState: 3
              };
            }
          };
          CustomWebSocket.prototype = OrigWebSocket.prototype;
          CustomWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          CustomWebSocket.OPEN = OrigWebSocket.OPEN;
          CustomWebSocket.CLOSING = OrigWebSocket.CLOSING;
          CustomWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = CustomWebSocket;
        }

        // Global unhandled error suppression for Vite development transport
        var origOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if ((url && String(url).indexOf('@vite/client') !== -1) || (msg && (String(msg).indexOf('WebSocket') !== -1 || String(msg).indexOf('moduleRunner') !== -1))) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
          return false;
        };

        window.addEventListener('error', function(e) {
          if (e && ((e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('moduleRunner') !== -1)) || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && (String(e.reason).indexOf('WebSocket') !== -1 || String(e.reason).indexOf('moduleRunner') !== -1 || String(e.reason).indexOf('@vite/client') !== -1)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
      (function() {
        try {
          var s = localStorage.getItem('cleanera_settings');
          var iconUrl = '/favicon.ico';
          if (s) {
            var parsed = JSON.parse(s);
            if (parsed.faviconUrl) {
              iconUrl = parsed.faviconUrl;
            }
            if (parsed.businessName) {
              document.title = parsed.businessName + (parsed.branchName ? ' (' + parsed.branchName + ')' : '');
            }
          }
          if (iconUrl) {
            var existing = document.querySelectorAll("link[rel*='icon']");
            for (var i = 0; i < existing.length; i++) {
              if (existing[i].parentNode) existing[i].parentNode.removeChild(existing[i]);
            }
            var isSvg = iconUrl.indexOf('data:image/svg') === 0 || iconUrl.indexOf('.svg') !== -1;
            var isPng = iconUrl.indexOf('data:image/png') === 0 || iconUrl.indexOf('.png') !== -1;
            var mimeType = isSvg ? 'image/svg+xml' : (isPng ? 'image/png' : 'image/x-icon');

            var l1 = document.createElement('link');
            l1.id = 'dynamic-favicon';
            l1.rel = 'icon';
            l1.type = mimeType;
            l1.href = iconUrl;
            document.head.appendChild(l1);

            var l2 = document.createElement('link');
            l2.id = 'dynamic-shortcut-icon';
            l2.rel = 'shortcut icon';
            l2.type = mimeType;
            l2.href = iconUrl;
            document.head.appendChild(l2);

            var l3 = document.createElement('link');
            l3.id = 'dynamic-apple-icon';
            l3.rel = 'apple-touch-icon';
            l3.href = iconUrl;
            document.head.appendChild(l3);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
